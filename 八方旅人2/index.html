<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>歧路旅人2 · 索里斯希亚全地图互动攻略</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/atlas.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <div>
        <h1>歧路旅人2 <small>OCTOPATH TRAVELER II</small></h1>
        <p>索里斯希亚全地图互动攻略</p>
      </div>
    </div>
    <div class="search-wrap">
      <input id="globalSearch" type="search" placeholder="搜索地点 / NPC / 怪物 / 道具 / 支线…" autocomplete="off">
      <div id="searchResults" class="search-results" hidden></div>
    </div>
    <nav class="top-actions">
      <button class="btn ghost" data-global-tab="characters">角色</button>
      <button class="btn ghost" data-global-tab="jobs">职业</button>
      <button class="btn ghost" data-global-tab="crossed">交汇篇</button>
      <button class="btn ghost" data-global-tab="finale">终章 / EX</button>
      <button class="btn ghost" data-global-tab="routes">路线 / 技巧</button>
    </nav>
  </header>

  <main class="layout">
    <section class="map-pane">
      <div class="map-toolbar">
        <button id="btnWorld" class="btn" title="返回世界地图">⟲ 世界地图</button>
        <div class="breadcrumb" id="breadcrumb">索里斯希亚</div>
        <div class="zoom-ctrl">
          <button id="zoomIn" class="btn icon" title="放大">＋</button>
          <button id="zoomOut" class="btn icon" title="缩小">－</button>
        </div>
      </div>
      <div class="map-stage" id="mapStage">
        <svg id="worldMap" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="索里斯希亚世界地图">
          <defs>
            <pattern id="wavePattern" width="60" height="30" patternUnits="userSpaceOnUse">
              <path d="M0 15 Q15 5 30 15 T60 15" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.4"/>
            </pattern>
            <radialGradient id="oceanGrad" cx="50%" cy="45%" r="75%">
              <stop offset="0%" stop-color="#1f5d8c"/>
              <stop offset="100%" stop-color="#0c2a45"/>
            </radialGradient>
            <filter id="landShadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#001020" flood-opacity="0.55"/>
            </filter>
            <pattern id="landGrain" width="8" height="8" patternUnits="userSpaceOnUse">
              <circle cx="2" cy="2" r="0.7" fill="rgba(60,40,10,0.12)"/>
              <circle cx="6" cy="5" r="0.5" fill="rgba(255,255,255,0.12)"/>
            </pattern>
          </defs>
          <g id="layerOcean"></g>
          <g id="layerSea"></g>
          <g id="layerShallow"></g>
          <g id="layerLand"></g>
          <g id="layerWater"></g>
          <g id="layerCoast"></g>
          <g id="layerDecor"></g>
          <g id="layerRoads"></g>
          <g id="layerLabels"></g>
          <g id="layerMarkers"></g>
        </svg>
        <div id="mapTooltip" class="map-tooltip" hidden></div>
        <div class="legend" id="legend"></div>
        <div class="map-hint" id="mapHint">点击任意地区放大查看 · 滚轮缩放 · 拖拽平移</div>
      </div>
    </section>

    <aside class="side-pane" id="sidePane">
      <div id="panel"></div>
    </aside>
  </main>

  <script src="data/core.js"></script>
  <script src="data/global.js" onerror="void 0"></script>
  <script src="data/winterlands.js" onerror="void 0"></script>
  <script src="data/wildlands.js" onerror="void 0"></script>
  <script src="data/brightlands.js" onerror="void 0"></script>
  <script src="data/harborlands.js" onerror="void 0"></script>
  <script src="data/leaflands.js" onerror="void 0"></script>
  <script src="data/crestlands.js" onerror="void 0"></script>
  <script src="data/hinoeuma.js" onerror="void 0"></script>
  <script src="data/totohaha.js" onerror="void 0"></script>
  <script src="data/sundering_sea.js" onerror="void 0"></script>
  <script src="data/detail/winterlands.js" onerror="void 0"></script>
  <script src="data/detail/wildlands.js" onerror="void 0"></script>
  <script src="data/detail/brightlands.js" onerror="void 0"></script>
  <script src="data/detail/harborlands.js" onerror="void 0"></script>
  <script src="data/detail/leaflands.js" onerror="void 0"></script>
  <script src="data/detail/crestlands.js" onerror="void 0"></script>
  <script src="data/detail/hinoeuma.js" onerror="void 0"></script>
  <script src="data/detail/totohaha.js" onerror="void 0"></script>
  <script src="data/detail/sundering_sea.js" onerror="void 0"></script>
  <script src="data/access.js" onerror="void 0"></script>
  <script src="assets/geo.js"></script>
  <script src="data/encounters.js"></script>
  <script src="assets/atlas.js"></script>
  <script src="assets/detail.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
